openapi: 3.1.0
info:
  title: Deadbolt / tf-low Control Plane API
  version: 1.0.0
  description: >-
    Versioned target HTTP contracts (M0). No endpoints are implemented
    by this PR. Authentication, tenant authorization, transactions, and runtime
    capability gates are implemented by their owning issues.
    Mutating tenant endpoints require Idempotency-Key: an identical retry returns
    the recorded outcome, while reuse with different request content returns 409.
    API-key plaintext is returned only by the first successful create or rotation;
    replay responses are redacted.
servers:
  - url: /v1
    description: Control Plane v1 API
paths:
  /workflows/{name}/runs:
    post:
      summary: Create and enqueue a new workflow run
      operationId: createRun
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: false
          schema: &a1
            type: string
          description:
            Required together with an allowed Origin for BrowserSession
            authentication; not used for bearer keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "202":
          description: Run accepted and persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      x-implemented: true
      x-required-capability: runs:create
  /runs/{id}:
    get:
      summary: Retrieve snapshot of a run
      operationId: getRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot of the run with revision and lastEventSequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSnapshot"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      x-implemented: true
      x-required-capability: runs:read
  /runs/{id}/events:
    get:
      summary: Get immutable execution events for a run with cursor pagination
      operationId: getRunEvents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: List of execution events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      x-implemented: true
      x-required-capability: runs:read
  /runs/{id}/stream:
    get:
      summary: Stream live run events via Server-Sent Events (SSE)
      operationId: streamRunEvents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      x-implemented: true
      x-required-capability: runs:read
  /runs/{id}/logs:
    get:
      summary: Get task diagnostic logs for a run
      operationId: getRunLogs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: stepId
          in: query
          schema:
            type: string
        - name: attemptId
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Bounded task logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        runId:
                          type: string
                        stepId:
                          type: string
                        attemptId:
                          type: string
                        sequence:
                          type: integer
                        timestamp:
                          type: string
                          format: date-time
                        level:
                          type: string
                          enum:
                            - debug
                            - info
                            - warn
                            - error
                        message:
                          type: string
                      required:
                        - id
                        - runId
                        - stepId
                        - attemptId
                        - sequence
                        - timestamp
                        - level
                        - message
                      additionalProperties: false
                  nextCursor:
                    type:
                      - string
                      - "null"
                  expired:
                    type: boolean
                required:
                  - items
                  - expired
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      x-implemented: true
      x-required-capability: payload:read
  /runs/{id}/pause:
    post:
      summary: Request durable pause on a run
      operationId: pauseRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - &a2
          name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-CSRF-Token
          in: header
          required: false
          schema: *a1
          description:
            Required together with an allowed Origin for BrowserSession
            authentication; not used for bearer keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionCommand"
      responses:
        "200":
          description: Run pause requested or confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      x-implemented: false
      x-required-capability: runs:control
      x-minimum-capability: V1
  /runs/{id}/resume:
    post:
      summary: Resume a paused run
      operationId: resumeRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - *a2
        - name: X-CSRF-Token
          in: header
          required: false
          schema: *a1
          description:
            Required together with an allowed Origin for BrowserSession
            authentication; not used for bearer keys.
      responses:
        "200":
          description: Run resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      x-implemented: false
      x-required-capability: runs:control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionCommand"
      x-minimum-capability: V1
  /runs/{id}/cancel:
    post:
      summary: Durably cancel an active run
      operationId: cancelRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - *a2
        - name: X-CSRF-Token
          in: header
          required: false
          schema: *a1
          description:
            Required together with an allowed Origin for BrowserSession
            authentication; not used for bearer keys.
      responses:
        "200":
          description: Cancellation initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      x-implemented: true
      x-required-capability: runs:control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionCommand"
  /deployments:
    post:
      summary: Register an immutable deployment manifest
      operationId: registerDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeploymentRequest"
      responses:
        "200":
          description: Deployment already registered (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "201":
          description: Deployment registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      x-implemented: true
      x-required-capability: deployments:register
      parameters:
        - *a2
        - name: X-CSRF-Token
          in: header
          required: false
          schema: *a1
          description:
            Required together with an allowed Origin for BrowserSession
            authentication; not used for bearer keys.
        - name: environment
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description:
            Select a verified member environment for browser sessions. Must
            match authoritative environment scope for an API key.
  /workflows/{name}/activate:
    post:
      summary: Set active deployment version for new runs
      operationId: activateDeployment
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - *a2
        - name: X-CSRF-Token
          in: header
          required: false
          schema: *a1
          description:
            Required together with an allowed Origin for BrowserSession
            authentication; not used for bearer keys.
        - name: environment
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description:
            Select a verified member environment for browser sessions. Must
            match authoritative environment scope for an API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deploymentId: *a1
                expectedRevision: &a3
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                allowSingleWorker:
                  type: boolean
                  default: false
              required:
                - deploymentId
                - expectedRevision
              additionalProperties: false
      responses:
        "200":
          description:
            Active pointer updated after environment-specific preflight;
            existing runs stay pinned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      x-implemented: true
      x-required-capability: deployments:activate:staging
  /reconciliation-cases/{id}/resolve:
    post:
      summary: Authoritative human/application decision for an unknown outcome
      operationId: resolveReconciliation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - *a2
        - name: X-CSRF-Token
          in: header
          required: false
          schema: *a1
          description:
            Required together with an allowed Origin for BrowserSession
            authentication; not used for bearer keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReconciliationRequest"
      responses:
        "200":
          description: Decision and audit accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  caseId: *a1
                  resolved:
                    const: true
                  revision: *a3
                required:
                  - caseId
                  - resolved
                  - revision
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      x-implemented: true
      x-required-capability: runs:reconcile
      security:
        - BrowserSession: []
  /runs/{id}/rerun:
    post:
      operationId: rerun
      summary: rerun
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
        - *a2
        - name: X-CSRF-Token
          in: header
          schema: *a1
          description: Required for browser-session mutations with validated Origin.
      x-required-capability: runs:create
      x-implemented: false
      responses:
        "202":
          description: Committed response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      security: &a4
        - EnvironmentKey: []
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input: {}
                deploymentId: *a1
              required:
                - input
              additionalProperties: false
      x-minimum-capability: V1
  /workflows:
    get:
      operationId: listworkflows
      summary: listworkflows
      parameters:
        - name: environment
          in: query
          required: true
          schema: *a1
        - name: cursor
          in: query
          schema: *a1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      x-required-capability: workflows:read
      x-implemented: false
      responses:
        "200":
          description: Committed response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workflow"
                  nextCursor:
                    type:
                      - string
                      - "null"
                required:
                  - items
                  - nextCursor
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      security: *a4
  /runs:
    get:
      operationId: listruns
      summary: listruns
      parameters:
        - name: environment
          in: query
          required: true
          schema: *a1
        - name: cursor
          in: query
          schema: *a1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      x-required-capability: runs:read
      x-implemented: true
      responses:
        "200":
          description: Committed response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
                  nextCursor:
                    type:
                      - string
                      - "null"
                required:
                  - items
                  - nextCursor
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      security: *a4
  /workers:
    get:
      operationId: listworkers
      summary: listworkers
      parameters:
        - name: environment
          in: query
          required: true
          schema: *a1
        - name: cursor
          in: query
          schema: *a1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      x-required-capability: workers:read
      x-implemented: true
      responses:
        "200":
          description: Committed response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Worker"
                  nextCursor:
                    type:
                      - string
                      - "null"
                required:
                  - items
                  - nextCursor
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      security: *a4
  /approvals/{id}/decision:
    post:
      operationId: decideApproval
      summary: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
        - *a2
        - name: X-CSRF-Token
          in: header
          schema: *a1
          description: Required for browser-session mutations with validated Origin.
      x-required-capability: approvals:decide
      x-implemented: false
      responses:
        "200":
          description: Committed response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *a1
                  status:
                    $ref: "#/components/schemas/ApprovalStatus"
                  revision: *a3
                required:
                  - id
                  - status
                  - revision
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  enum:
                    - approved
                    - rejected
                expectedRevision: *a3
                comment: *a1
              required:
                - decision
                - expectedRevision
              additionalProperties: false
      x-minimum-capability: V1
