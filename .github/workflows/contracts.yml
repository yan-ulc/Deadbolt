name: Foundation contracts
on:
  pull_request:
  push:
    branches: [main, "feature/m0-foundation-contracts"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
      DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:config
      - run: pnpm lint
      - run: test -z "$(gofmt -l contracts internal tests)"
      - run: pnpm typecheck
      - run: pnpm test
      - run: go test -race ./...
      - run: go vet ./...
      - run: pnpm check:contracts
      - run: pnpm check:parity
      - run: node scripts/check-candidates.mjs
      - run: go mod verify
      - run: pnpm audit
      - run: node scripts/install-tools.mjs sqlc goose gitleaks govulncheck
      - run: bin/sqlc version
      - run: bin/goose --version
      - run: bin/govulncheck ./...
      - name: Verify control plane Dockerfile builds
        run: |
          docker build -f deploy/Dockerfile.control-plane --build-arg COMMIT_SHA="${{ github.sha }}" -t deadbolt-control-plane:test .
      - name: Validate Docker Compose and Profiles
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile core config --quiet
          docker compose -f deploy/compose/docker-compose.yml --profile telemetry config --quiet
          docker compose -f deploy/compose/docker-compose.yml --profile fault config --quiet
          DEADBOLT_DB_ADMIN_PASSWORD=mock_admin DEADBOLT_MIGRATOR_PASSWORD=mock_migrator DEADBOLT_RUNTIME_PASSWORD=mock_runtime DEADBOLT_SYSTEM_PASSWORD=mock_system DATABASE_URL=postgres://deadbolt_runtime:mock_runtime@localhost:5432/mock MIGRATOR_DATABASE_URL=postgres://deadbolt_migrator:mock_migrator@localhost:5432/mock SYSTEM_DATABASE_URL=postgres://deadbolt_system:mock_system@localhost:5432/mock DEADBOLT_IMAGE=ghcr.io/ryanakml/deadbolt/control-plane@sha256:1111222233334444555566667777888899990000aaaaabbbbbcccccdddddeeeee DEADBOLT_POSTGRES_IMAGE=ghcr.io/ryanakml/deadbolt/postgres@sha256:1111222233334444555566667777888899990000aaaaabbbbbcccccdddddeeeee DEADBOLT_OIDC_ISSUER=https://i DEADBOLT_OIDC_CLIENT_ID=id DEADBOLT_OIDC_CLIENT_SECRET=s DEADBOLT_STAGING_DOMAIN=staging.deadbolt.cloud docker compose -f deploy/compose/docker-compose.staging.yml --profile slot-blue --profile slot-green config --quiet
          DEADBOLT_STAGING_DOMAIN=staging.deadbolt.cloud DEADBOLT_SNIPPET_ONLY=true DRY_RUN=true ./scripts/reload-caddy.sh


          DRY_RUN=true ./scripts/check-backup-readiness.sh
          DRY_RUN=true ./scripts/bootstrap-staging-cluster.sh
          DRY_RUN=true ./scripts/deploy-staging.sh
          DRY_RUN=true ./scripts/rollback-staging.sh
          DRY_RUN=true ./scripts/retention.sh
          DRY_RUN=true ./scripts/take-base-backup.sh
          DRY_RUN=true ./scripts/restore-staging-db.sh
          DRY_RUN=true ./scripts/setup-backup-cron.sh
          docker build -f deploy/Dockerfile.postgres .
      - name: Clean-clone Local Compose Boot Smoke
        run: |
          # Free host port 5432 if occupied by workflow runner service container
          RUNNER_PG=$(docker ps -q --filter "publish=5432")
          if [ -n "$RUNNER_PG" ]; then
            echo "Stopping workflow runner Postgres service container ($RUNNER_PG) to free port 5432..."
            docker stop "$RUNNER_PG"
          fi
          docker compose -f deploy/compose/docker-compose.yml --profile core up -d || (docker compose -f deploy/compose/docker-compose.yml --profile core logs && exit 1)
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/livez >/dev/null 2>&1; then
              echo "Local compose control plane is alive!"
              break
            fi
            sleep 2
          done
          # Verify livez returned 200 OK
          curl -fs http://127.0.0.1:8080/livez || (docker compose -f deploy/compose/docker-compose.yml --profile core logs && exit 1)
          # These assets must come from the final control-plane image, not a
          # source checkout. Keep this smoke beside the image/Compose gate.
          curl -fs http://127.0.0.1:8080/dashboard/ >/dev/null || (docker compose -f deploy/compose/docker-compose.yml --profile core logs && exit 1)
          curl -fs http://127.0.0.1:8080/dashboard/index.js >/dev/null || (docker compose -f deploy/compose/docker-compose.yml --profile core logs && exit 1)
          curl -fs http://127.0.0.1:8080/dashboard/styles.css >/dev/null || (docker compose -f deploy/compose/docker-compose.yml --profile core logs && exit 1)
          node scripts/verify-dashboard-esm.mjs http://127.0.0.1:8080/dashboard || (docker compose -f deploy/compose/docker-compose.yml --profile core logs && exit 1)
          # Execute migrations using in-container migrator runner
          docker compose -f deploy/compose/docker-compose.yml --profile core exec -T control-plane /usr/local/bin/control-plane --migrate
          # Verify readyz returned 200 OK after schema is current
          READYZ_OK=false
          for i in $(seq 1 15); do
            if curl -fs http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              READYZ_OK=true
              echo "Local compose control plane is ready!"
              break
            fi
            sleep 1
          done
          if [ "$READYZ_OK" != "true" ]; then
            docker compose -f deploy/compose/docker-compose.yml --profile core logs && exit 1
          fi
          # Test stop and start preserves volume persistence
          docker compose -f deploy/compose/docker-compose.yml --profile core stop
          docker compose -f deploy/compose/docker-compose.yml --profile core start
          curl -fs http://127.0.0.1:8080/livez >/dev/null 2>&1 || (docker compose -f deploy/compose/docker-compose.yml --profile core logs && exit 1)
          # Explicit clean teardown
          docker compose -f deploy/compose/docker-compose.yml --profile core down -v
      - name: Scan tracked source and history without printing secrets
        run: |
          bin/gitleaks git --redact --no-banner --log-opts="--all"
  sp03-native-addon:
    name: SP-03 native addon (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: true
      - name: Compile and execute the target-native N-API fixture
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @runtime/runner run build
          NODE_ROOT="$(dirname "$(dirname "$(node -p 'process.execPath')")")"
          cc -shared -fPIC -DNODE_GYP_MODULE_NAME=native_addon -I "$NODE_ROOT/include/node" tests/spikes/sp03/native-addon/native-addon.c -o tests/spikes/sp03/native-addon/native-addon.node
          test "$(node -p 'process.arch')" = "${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}"
          node tests/spikes/sp03/native-addon/native-addon.test.cjs
          tar -C tests/spikes/sp03/native-addon -cf tests/spikes/sp03/native-addon/native-bundle.tar native-task.mjs native-addon.node
          SP03_NATIVE_BUNDLE="$GITHUB_WORKSPACE/tests/spikes/sp03/native-addon/native-bundle.tar" go test ./tests/spikes/sp03 -run TestSP03_VerifiedNativeBundle -count=1
